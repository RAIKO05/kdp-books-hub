<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 14px;
      margin: 0;
      background: #0D1117;
      color: #F0F6FC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #E3B341;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info {
      color: #8B949E;
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      background: #238636;
      color: #FFF;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-gold {
      background: #E3B341;
      color: #000;
    }
  </style>
</head>
<body>
  <h2>⚡ KDP 100-Book Auto-Publisher</h2>
  <div class="info">
    Navigate to <b>kdp.amazon.com</b> and create or edit a Paperback. The floating Auto-Fill control panel will automatically appear on the page!
  </div>
  <a href="https://kdp.amazon.com/en_US/bookshelf" target="_blank" class="btn">
    🚀 Open Amazon KDP Bookshelf
  </a>
  <a href="http://localhost:8080/index.html" target="_blank" class="btn btn-gold">
    📚 Open Local KDP Books Hub
  </a>
</body>
</html>
